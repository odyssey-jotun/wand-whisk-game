# Publishes three versions: main at the site root, animated at /animated/, walking at /walking/
name: Deploy all games
on:
  push:
    branches: [main, animated, walking]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/checkout@v4
        with: { ref: animated, path: animated }
      - uses: actions/checkout@v4
        with: { ref: walking, path: walking }
      - run: |
          rm -rf site/.git site/.github
          for v in animated walking; do
            mkdir -p site/$v
            rsync -a --exclude .git --exclude .github $v/ site/$v/
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
