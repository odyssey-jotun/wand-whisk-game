<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wand &amp; Whisk: Milk Panic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --pink:#f2a7bd; --deep:#c4527a; --plum:#5b3a78; --cream:#fff6ef; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#2b1d3a; overflow:hidden; touch-action:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Fredoka',system-ui,sans-serif; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.4); image-rendering:auto; }
  .pad { position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); display:none; gap:12px; }
  .pad.left { left:14px; } .pad.right { right:14px; }
  .pad button { width:64px; height:64px; border-radius:50%; border:none; background:rgba(255,246,239,.82);
    color:var(--plum); font:700 22px 'Fredoka',sans-serif; box-shadow:0 3px 0 rgba(0,0,0,.25); user-select:none; -webkit-user-select:none; }
  .pad button.big { width:76px; height:76px; background:var(--pink); color:#fff; }
  @media (pointer:coarse) { .pad { display:flex; } }
  #turn { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:#2b1d3a; color:#fff6ef; font:700 22px 'Fredoka',sans-serif; text-align:center; padding:24px; }
  #turn span { font-size:54px; display:inline-block; animation:tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 50% { transform:rotate(90deg); } }
  @media (pointer:coarse) and (orientation:portrait) { #turn { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div class="pad left">
    <button data-k="left" aria-label="Left">&#9664;</button>
    <button data-k="right" aria-label="Right">&#9654;</button>
    <button data-k="down" aria-label="Crouch">&#9660;</button>
  </div>
  <div class="pad right">
    <button data-k="shoot" aria-label="Magic, hold to charge">&#9733;</button>
    <button data-k="jump" class="big" aria-label="Jump">&#9650;</button>
  </div>
  <div id="turn"><span>&#128241;</span>Turn your phone sideways to play</div>
</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, GRAV = 0.62, GROUND = 470;
const CHARGE = 55, SPECIAL_COST = 30, MANA_MAX = 100, HP_MAX = 4;

// ---------- sizing ----------
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// ---------- assets ----------
// bump when art changes so phones don't show cached old images
const ASSET_V = 8;
const img = n => { const i = new Image(); i.src = 'assets/' + n + '.png?v=' + ASSET_V; return i; };
const IMG = { matcha: img('matcha'), strawberry: img('strawberry'), ube: img('ube'), creamia: img('creamia'),
  cow: img('cow'), 'body-strawberry': img('body-strawberry'), 'body-matcha': img('body-matcha'),
  'body-ube': img('body-ube'), 'body-creamia': img('body-creamia'),
  ...Object.fromEntries([['strawberry', []], ['matcha', ['arm']]].flatMap(([id, extra]) =>
    ['body', 'thighA', 'shinA', 'thighB', 'shinB', ...extra].map(n => [`rig-${id}-${n}`, img(`rig/${id}-${n}`)]))), logo: img('logo'), health: img('potion-health'), mana: img('potion-mana') };

// Tap fires each girl's basic shot. Hold to charge, release for her special (costs mana).
const GIRLS = [
  { id:'strawberry', name:'Strawberry', color:'#e86a8f',
    blurb:'Floats on her crepe. Charge: a giant heart that blasts through everything.',
    speed:5.2, jump:13.2, float:true, cool:13 },
  { id:'matcha', name:'Matcha', color:'#4fa35a',
    blurb:'Fastest runner, rapid bubbles. Charge: a fan of eight matcha bubbles.',
    speed:6.4, jump:12.6, cool:7 },
  { id:'ube', name:'Ube', color:'#7a4fb0',
    blurb:'Double jump. Stars curve toward enemies. Charge: three homing moons.',
    speed:5.4, jump:13.8, double:true, cool:14 },
  { id:'creamia', name:'Creamia', color:'#d9a531',
    blurb:'Lobs soft serve over walls. Charge: a taiyaki that rolls through the room.',
    speed:5.0, jump:13.0, cool:18, wide:true },
];

// ---------- input ----------
const keys = {};
const map = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump', ArrowDown:'down', KeyS:'down',
  KeyX:'shoot', KeyJ:'shoot', KeyK:'shoot', Enter:'enter', KeyZ:'jump' };
addEventListener('keydown', e => { const k = map[e.code]; if (k) { if (!keys[k]) keys[k + 'Hit'] = true; keys[k] = true; e.preventDefault(); } });
addEventListener('keyup', e => { const k = map[e.code]; if (k) keys[k] = false; });
document.querySelectorAll('.pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); if (!keys[k]) keys[k + 'Hit'] = true; keys[k] = true; };
  const off = e => { e.preventDefault(); keys[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  clickAt((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
});
const clearHits = () => { for (const k in keys) if (k.endsWith('Hit')) keys[k] = false; };
const hit = k => { const v = keys[k + 'Hit']; keys[k + 'Hit'] = false; return v; };

// ---------- audio (tiny synth, no files) ----------
let AC;
function beep(f, d = .08, type = 'square', vol = .05, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const sfx = {
  jump: () => beep(520, .12, 'square', .04, 300),
  shoot: () => beep(880, .07, 'triangle', .05, -300),
  special: () => { beep(330, .3, 'sawtooth', .06, 700); beep(660, .3, 'triangle', .05, 900); },
  ready: () => beep(1320, .1, 'sine', .05),
  star: () => { beep(1046, .06, 'sine', .06); setTimeout(() => beep(1568, .1, 'sine', .06), 60); },
  potion: () => [784, 988, 1175].forEach((f, i) => setTimeout(() => beep(f, .09, 'sine', .06), i * 55)),
  hurt: () => beep(200, .25, 'sawtooth', .06, -120),
  pop: () => beep(330, .1, 'square', .05, -200),
  moo: () => { beep(140, .5, 'sawtooth', .07, -50); beep(210, .5, 'triangle', .04, -70); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .18, 'triangle', .07), i * 140)),
};

// ---------- level ----------
const LEVEL_END = 7200, ARENA_X = 6300;
const solids = [
  [0, GROUND, 1100, 80, 'ground'],
  [1250, GROUND, 700, 80, 'ground'],
  [2100, GROUND, 520, 80, 'ground'],
  [2780, GROUND, 900, 80, 'ground'],
  [3860, GROUND, 600, 80, 'ground'],
  [4620, GROUND, 1300, 80, 'ground'],
  [6080, GROUND, 1200, 80, 'ground'],
  [520, 360, 150, 22, 'crepe'], [760, 280, 150, 22, 'crepe'],
  [1080, 380, 140, 22, 'crepe'], [1500, 330, 160, 22, 'crepe'], [1740, 240, 140, 22, 'crepe'],
  [1960, 360, 120, 22, 'crepe'], [2300, 320, 150, 22, 'crepe'], [2620, 380, 140, 22, 'crepe'],
  [3050, 340, 160, 22, 'crepe'], [3300, 250, 160, 22, 'crepe'], [3560, 170, 150, 22, 'crepe'],
  [3700, 370, 140, 22, 'crepe'], [4100, 330, 150, 22, 'crepe'], [4460, 380, 150, 22, 'crepe'],
  [4900, 320, 150, 22, 'crepe'], [5150, 230, 150, 22, 'crepe'], [5420, 320, 150, 22, 'crepe'],
  [5920, 380, 150, 22, 'crepe'],
  [1350, 410, 60, 60, 'waffle'], [2880, 410, 60, 60, 'waffle'], [2940, 350, 60, 120, 'waffle'],
  [4700, 410, 60, 60, 'waffle'], [5700, 410, 60, 60, 'waffle'], [5760, 350, 60, 120, 'waffle'],
].map(([x, y, w, h, k]) => ({ x, y, w, h, k }));

const starSpots = [
  [300, 420], [360, 420], [420, 420], [595, 320], [835, 240], [835, 200], [1150, 340], [1575, 290], [1810, 200],
  [1810, 160], [2020, 320], [2375, 280], [2690, 340], [3130, 300], [3380, 210], [3635, 130], [3635, 90],
  [3770, 330], [4175, 290], [4535, 340], [4975, 280], [5225, 190], [5225, 150], [5495, 280], [5995, 340],
  [1190, 300], [2050, 250], [3770, 250], [4540, 260], [5850, 250],
];
const enemySpots = [
  [900, 'drop'], [1600, 'drop'], [1800, 'carton'], [2400, 'drop'], [3100, 'carton'], [3300, 'drop'],
  [3450, 'drop'], [4000, 'carton'], [4250, 'drop'], [4800, 'drop'], [5050, 'carton'], [5300, 'drop'], [5500, 'carton'],
];

// ---------- state ----------
let scene = 'title', pick = 0, P, cam, stars, enemies, shots, milk, parts, potions, boss, score, t = 0, shake = 0, endTimer = 0, toast = null;

function reset() {
  const g = GIRLS[pick];
  P = { g, x: 120, y: GROUND - 90, vx: 0, vy: 0, w: 56, h: 86, face: 1, ground: false, jumps: 0,
    hp: 3, mana: MANA_MAX, inv: 0, cool: 0, charge: 0, chargeReady: false, dead: false,
    flipS: 1, sq: 0, sqV: 0, walk: 0, aim: 0, crouch: false, recoil: 0, cast: 0, hurtT: 0, hover: 12, wasGround: false };
  cam = 0; score = 0; shots = []; milk = []; parts = []; potions = []; toast = null;
  stars = starSpots.map(([x, y]) => ({ x, y, got: false }));
  enemies = enemySpots.map(([x, k]) => ({ x, y: GROUND - (k === 'drop' ? 38 : 64), w: k === 'drop' ? 38 : 46,
    h: k === 'drop' ? 38 : 64, k, vx: -1.2, vy: 0, hp: k === 'drop' ? 2 : 4, flash: 0, alive: true, home: x }));
  boss = { x: 6880, y: GROUND - 172, w: 260, h: 172, vy: 0, hp: 60, max: 60, flash: 0, timer: 90, phase: 0,
    active: false, dead: false, dir: -1, drops: 0 };
}

// ---------- helpers ----------
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const shotBox = s => ({ x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 });
const inSolid = (x, y) => solids.some(s => x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h);
function burst(x, y, col, n = 12, sp = 5) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = Math.random() * sp + 1;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20, col, r: 3 + Math.random() * 4 }); }
}
function say(text, col = '#5b3a78') { toast = { text, col, life: 70 }; }
function collide(o) {
  o.x += o.vx;
  for (const s of solids) if (overlap(o, s) && s.k !== 'crepe') {
    if (o.vx > 0) o.x = s.x - o.w; else if (o.vx < 0) o.x = s.x + s.w; o.vx = o.bounceX ? -o.vx : 0;
  }
  const prevBottom = o.y + o.h;
  o.y += o.vy; o.ground = false;
  for (const s of solids) if (overlap(o, s)) {
    if (s.k === 'crepe') {
      if (o.vy >= 0 && prevBottom <= s.y + 2) { o.y = s.y - o.h; o.vy = 0; o.ground = true; }
    } else if (o.vy > 0) { o.y = s.y - o.h; o.vy = 0; o.ground = true; }
    else if (o.vy < 0) { o.y = s.y + s.h; o.vy = 0; }
  }
}
function hurtPlayer(fromX) {
  if (P.inv > 0 || P.dead) return;
  P.hp--; P.inv = 90; P.hurtT = 24; P.vy = -8; P.vx = (P.x < fromX ? -6 : 6); shake = 12; sfx.hurt(); P.charge = 0;
  burst(P.x + P.w / 2, P.y + 30, '#ffc6d6', 14);
  if (P.hp <= 0) { P.dead = true; endTimer = 120; }
}
function dropPotion(x, y, always) {
  if (!always && Math.random() > 0.45) return;
  // lean toward whatever the player is short on
  const needHp = (HP_MAX - P.hp) / HP_MAX, needMana = (MANA_MAX - P.mana) / MANA_MAX;
  const kind = Math.random() < 0.5 + (needHp - needMana) * 0.6 ? 'health' : 'mana';
  potions.push({ x: x - 14, y: y - 30, w: 28, h: 46, vx: (Math.random() - .5) * 3, vy: -7, k: kind, ground: false, age: 0 });
}
function nearestTarget(x, y, range = 520) {
  let best = null, bd = range;
  for (const e of enemies) if (e.alive) { const d = Math.hypot(e.x + e.w / 2 - x, e.y + e.h / 2 - y); if (d < bd) { bd = d; best = e; } }
  if (boss.active && !boss.dead) { const d = Math.hypot(boss.x + boss.w / 2 - x, boss.y + boss.h / 2 - y); if (d < bd + 200) best = boss; }
  return best;
}

// ---------- attacks ----------
function fireBasic() {
  const id = P.g.id, f = P.face, x = P.x + P.w / 2 + f * 30, y = P.y + 36;
  if (id === 'strawberry') shots.push({ k: 'berry', x, y, vx: f * 11, vy: 0, r: 10, dmg: 1, life: 55 });
  if (id === 'matcha') shots.push({ k: 'bubble', x, y: y + (Math.random() - .5) * 10, vx: f * 13, vy: 0, r: 9, dmg: 1, life: 45, wob: Math.random() * 6 });
  if (id === 'ube') shots.push({ k: 'star', x, y, vx: f * 10, vy: 0, r: 10, dmg: 1, life: 70, home: 0.35 });
  if (id === 'creamia') shots.push({ k: 'serve', x, y: y - 10, vx: f * 7 + P.vx * .4, vy: -8, r: 12, dmg: 2, life: 120, grav: .42, splash: true });
  P.cool = P.g.cool; P.recoil = 5; P.cast = 8; sfx.shoot();
}
function fireSpecial() {
  const id = P.g.id, f = P.face, x = P.x + P.w / 2 + f * 30, y = P.y + 40;
  P.mana -= SPECIAL_COST; P.recoil = 14; P.cast = 18; P.sqV -= .15; sfx.special(); shake = 6;
  if (id === 'strawberry') shots.push({ k: 'heart', x, y, vx: f * 9, vy: 0, r: 30, dmg: 6, life: 110, pierce: true, hits: new Set() });
  if (id === 'matcha') for (let i = 0; i < 8; i++) { const a = (i - 3.5) * 0.13;
    shots.push({ k: 'bubble', big: true, x, y, vx: f * Math.cos(a) * 12, vy: Math.sin(a) * 12, r: 13, dmg: 2, life: 50, wob: i }); }
  if (id === 'ube') for (let i = 0; i < 3; i++)
    shots.push({ k: 'moon', x, y: y - 20 + i * 20, vx: f * (6 + i), vy: -4 + i * 4, r: 16, dmg: 4, life: 150, home: 0.9 });
  if (id === 'creamia') shots.push({ k: 'taiyaki', x, y: y - 6, vx: f * 8.5, vy: -4, r: 26, dmg: 5, life: 150, grav: .5, roll: true, pierce: true, hits: new Set() });
  burst(x, y, P.g.color, 18, 6);
}
function damage(target, s) {
  if (s.pierce) { if (s.hits.has(target)) return false; s.hits.add(target); } else s.life = 0;
  return true;
}

// ---------- update ----------
function update() {
  t++;
  if (toast && --toast.life <= 0) toast = null;
  if (scene === 'title') {
    if (hit('left')) { pick = (pick + GIRLS.length - 1) % GIRLS.length; sfx.pop(); }
    if (hit('right')) { pick = (pick + 1) % GIRLS.length; sfx.pop(); }
    if (hit('jump') || hit('enter') || hit('shoot')) start();
    return;
  }
  if (scene === 'win' || scene === 'over') {
    if (endTimer > 0) endTimer--;
    else if (hit('jump') || hit('enter') || hit('shoot')) { scene = 'title'; clearHits(); }
    updateParts(); return;
  }

  // player movement
  const g = P.g;
  if (!P.dead) {
    // crouch: plant, shrink the hitbox from the top, keep the feet where they are
    const wantCrouch = keys.down && P.ground && !keys.jump;
    if (wantCrouch && !P.crouch) { P.crouch = true; P.y += 30; P.h = 56; }
    else if (!wantCrouch && P.crouch) { P.crouch = false; P.y -= 30; P.h = 86; }
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) P.face = dir;
    if (dir && !P.crouch) P.vx += dir * 0.9; else P.vx *= 0.78;
    P.vx = Math.max(-g.speed, Math.min(g.speed, P.vx));
    if (hit('jump')) {
      if (P.ground) { P.vy = -g.jump; P.jumps = 1; P.sqV -= .22; sfx.jump(); }
      else if (g.double && P.jumps < 2) { P.vy = -g.jump * 0.9; P.jumps = 2; P.sqV -= .2; sfx.jump(); burst(P.x + P.w / 2, P.y + P.h, '#b88cf0', 8, 3); }
    }
    if (!keys.jump && P.vy < -4) P.vy += 0.9;
    P.vy += GRAV;
    if (g.float && keys.jump && P.vy > 1.6) P.vy = 1.6;
    P.vy = Math.min(P.vy, 15);

    // shooting: press = basic shot, hold = charge, release when full = special
    if (P.cool > 0) P.cool--;
    if (hit('shoot') && P.cool === 0) fireBasic();
    if (keys.shoot) {
      if (P.mana >= SPECIAL_COST) {
        P.charge = Math.min(CHARGE, P.charge + 1);
        if (P.charge === CHARGE && !P.chargeReady) { P.chargeReady = true; sfx.ready(); }
        else if (P.charge > 12 && P.charge % 9 === 0 && !P.chargeReady) beep(300 + P.charge * 12, .05, 'sine', .025);
      } else if (P.charge === 0 && keys.shoot === true && t % 40 === 0) say('Need mana!', '#3d7fd6');
    } else {
      if (P.chargeReady) fireSpecial();
      P.charge = 0; P.chargeReady = false;
    }
    P.mana = Math.min(MANA_MAX, P.mana + 0.04);
  } else { P.vx *= .9; P.vy += GRAV; }
  const vyBefore = P.vy;
  collide(P);
  animatePlayer(vyBefore);
  if (P.x < cam) P.x = cam, P.vx = 0;
  if (boss.active && P.x + P.w > LEVEL_END - 20) P.x = LEVEL_END - 20 - P.w;
  if (P.y > H + 100 && !P.dead) { P.hp = 0; P.dead = true; endTimer = 90; sfx.hurt(); }
  if (P.inv > 0) P.inv--;
  if (P.ground) P.jumps = 0;

  // camera
  const target = Math.max(0, P.x - W * 0.38);
  if (!boss.active) cam += (target - cam) * 0.12;
  if (P.x > ARENA_X + 120 && !boss.active && !boss.dead) { boss.active = true; sfx.moo(); shake = 18; say('Strawberry Milk wakes up!', '#c4527a'); }
  if (boss.active || boss.dead) cam += (LEVEL_END - W - cam) * 0.08;
  cam = Math.min(cam, LEVEL_END - W);

  // stars
  for (const s of stars) if (!s.got && Math.abs(P.x + P.w / 2 - s.x) < 36 && Math.abs(P.y + P.h / 2 - s.y) < 50) {
    s.got = true; score += 10; sfx.star(); burst(s.x, s.y, '#ffd75e', 8, 3);
  }

  // potions
  for (const p of potions) {
    p.age++; p.vy += GRAV * .8; p.vx *= .97; collide(p);
    if (p.y > H + 100) p.gone = true;
    if (!P.dead && p.age > 15 && overlap(P, p)) {
      p.gone = true; sfx.potion();
      if (p.k === 'health') { P.hp = Math.min(HP_MAX, P.hp + 1); say('Health Float! +1 heart', '#e8456b'); burst(p.x + 14, p.y + 20, '#ff6f8f', 14, 4); }
      else { P.mana = Math.min(MANA_MAX, P.mana + 50); say('Mana Float! +50 mana', '#3d7fd6'); burst(p.x + 14, p.y + 20, '#6fb3ff', 14, 4); }
    }
  }
  potions = potions.filter(p => !p.gone);

  // player shots
  for (const s of shots) {
    s.life--;
    if (s.home) { const tg = nearestTarget(s.x, s.y); if (tg) {
      const dx = tg.x + tg.w / 2 - s.x, dy = tg.y + tg.h / 2 - s.y, d = Math.hypot(dx, dy) || 1, sp = Math.hypot(s.vx, s.vy);
      s.vx += dx / d * s.home; s.vy += dy / d * s.home; const n = Math.hypot(s.vx, s.vy) || 1; s.vx *= sp / n; s.vy *= sp / n; } }
    if (s.grav) s.vy += s.grav;
    s.x += s.vx; s.y += s.vy;
    if (s.k === 'bubble') s.y += Math.sin((t + s.wob * 7) * .35) * 1.4;
    if (s.k === 'heart' && t % 2 === 0) parts.push({ x: s.x - s.vx, y: s.y + (Math.random() - .5) * 30, vx: -s.vx * .1, vy: 0, life: 22, col: '#ffb3c8', r: 5 });
    if (s.roll) { // taiyaki rolls along the floor
      if (inSolid(s.x, s.y + s.r) && s.vy > 0) { s.y -= s.vy; s.vy = -Math.abs(s.vy) * .45; if (Math.abs(s.vy) < 2) s.vy = 0; }

  ctx.font = '700 21px Fredoka';
  ctx.fillText(matchMedia('(pointer:coarse)').matches ? 'Tap a girl twice to play' : '← → choose · Space to play', W / 2, 482);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#8a6f96'; ctx.font = '500 14px Fredoka'; ctx.fillText('Strawberry Milk is on a rampage. Save the cafe!', W / 2, 512);
}
function drawEnd(win) {
  ctx.fillStyle = win ? 'rgba(253,227,234,.92)' : 'rgba(43,29,58,.82)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (win) {
    drawWalker(P.g.id, W / 2, 350, 2, { mode: Math.sin(t / 25) > .6 ? 'rise' : 'idle', amp: 1.6 });
    ctx.fillStyle = '#c4527a'; ctx.font = '700 46px Fredoka'; ctx.fillText('The cafe is saved!', W / 2, 90);
    ctx.fillStyle = '#5b3a78'; ctx.font = '700 26px Fredoka'; ctx.fillText(`${P.g.name} calmed down Strawberry Milk  ·  ★ ${score}`, W / 2, 385);
    const got = stars.filter(s => s.got).length; ctx.font = '500 18px Fredoka'; ctx.fillText(`${got} of ${stars.length} stars`, W / 2, 415);
  } else {
    ctx.fillStyle = '#fff'; ctx.font = '700 46px Fredoka'; ctx.fillText('Spilled!', W / 2, 220);
    ctx.font = '500 22px Fredoka'; ctx.fillText('Strawberry Milk wins this round.', W / 2, 262);
  }
  if (endTimer <= 0) { ctx.globalAlpha = .6 + .4 * Math.sin(t / 12); ctx.fillStyle = win ? '#5b3a78' : '#ffd0de'; ctx.font = '700 22px Fredoka';
    ctx.fillText('Press Space or tap to play again', W / 2, win ? 470 : 330); ctx.globalAlpha = 1; }
}

function draw() {
  if (scene === 'title') return drawTitle();
  ctx.save();
  if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawBackground(); drawSolids(); drawStars(); drawPotions(); drawEnemies(); drawBoss(); drawPlayer(); drawShots();
  ctx.restore();
  drawHUD();
  if (scene === 'win') drawEnd(true);
  if (scene === 'over') drawEnd(false);
}

// fixed-step loop so speed is the same on 60Hz and 120Hz screens
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
// test hooks
window.__game = { get scene() { return scene; }, get P() { return P; }, get boss() { return boss; }, get shots() { return shots; },
  get potions() { return potions; }, start: i => { pick = i; start(); }, warp: x => { P.x = x; P.y = GROUND - P.h; cam = Math.max(0, x - 300); },
  drop: k => potions.push({ x: P.x + 80, y: GROUND - 120, w: 28, h: 46, vx: 0, vy: 0, k, ground: false, age: 0 }) };
})();
</script>
